<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - منصة الأحياء</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .login-container { background-color: #1e1e1e; padding: 40px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #ff9800; margin-bottom: 24px; font-size: 24px; }
        .input-group { margin-bottom: 20px; text-align: right; }
        label { display: block; margin-bottom: 8px; color: #cccccc; font-size: 14px; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333333; background-color: #2c2c2c; color: #ffffff; font-size: 16px; outline: none; }
        input:focus { border-color: #ff9800; }
        .btn { width: 100%; padding: 12px; background-color: #ff9800; color: #121212; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn:hover { background-color: #e68900; }
        .links { margin-top: 20px; font-size: 14px; }
        .links a { color: #ff9800; text-decoration: none; }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>تسجيل الدخول</h2>
        <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
            <div class="input-group">
                <label for="email">البريد الإلكتروني أو رقم الهاتف</label>
                <input type="text" id="email" required placeholder="ادخل البيانات هنا...">
            </div>
            <div class="input-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn">دخول</button>
        </form>
        <div class="links">
            <p>ليس لديك حساب؟ <a href="signup.html">إنشاء حساب جديد</a></p>
            <p style="margin-top: 10px;"><a href="index.html">العودة للرئيسية</a></p>
        </div>
    </div>
</body>
</html>
