<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #212529; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-container { background-color: #181b1f; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); width: 100%; max-width: 400px; text-align: right; }
        h2 { color: #ffff99; margin-bottom: 24px; font-size: 24px; }
        .input-group { margin-bottom: 20px; text-align: right; }
        label { display: block; margin-bottom: 8px; color: #ffffff; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 1px solid #333333; background-color: #212529; color: #ffffff; border-radius: 6px; font-size: 14px; }
        input:focus { border-color: #ffff99; }
        .btn { width: 100%; padding: 12px; background-color: #ffff99; color: #212529; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; transition: background 0.3s; }
        .btn:hover { background-color: #e6e680; }
        .links { margin-top: 20px; font-size: 14px; }
        .links a { color: #ffff99; text-decoration: none; }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>تسجيل الدخول</h2>
        <!-- تم تعديل هذا السطر لمنع الانتقال المباشر واستدعاء دالة التحقق -->
        <form id="loginForm">
            <div class="input-group">
                <label for="email">البريد الإلكتروني أو رقم الهاتف</label>
                <input type="text" id="email" required placeholder="أدخل البريد...">
            </div>
            <div class="input-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" required placeholder="********">
            </div>
            <button type="submit" class="btn">دخول</button>
        </form>
        <div class="links">
            <a href="signup.html">ليس لديك حساب؟ أنشئ حساب جديد</a>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDZqUjL9mWbCDc0vVqfV9FvX0N_CjQ",
            authDomain: "osamaahmed-5d24b.firebaseapp.com",
            projectId: "osama-5d24b",
            storageBucket: "osama-5d24b.appspot.com",
            messagingSenderId: "587394968804",
            appId: "1:587394968804:web:f56730058e0a65bbd6973_"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // ربط نموذج تسجيل الدخول بعملية التحقق عبر فايربيس
        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault(); // منع إعادة تحميل الصفحة
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // تم تسجيل الدخول بنجاح، الانتقال للوحة التحكم
                    window.location.href = 'dashboard.html';
                })
                .catch((error) => {
                    alert("خطأ في تسجيل الدخول: " + error.message);
                });
        });
    </script>
</body>
</html>
