<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد - منصة الأحياء</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .signup-container { background-color: #1e1e1e; padding: 30px 40px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); width: 100%; max-width: 450px; }
        h2 { color: #ff9800; margin-bottom: 20px; font-size: 24px; text-align: center; }
        .input-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 6px; color: #cccccc; font-size: 14px; }
        input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #333333; background-color: #2c2c2c; color: #ffffff; font-size: 15px; outline: none; }
        input:focus { border-color: #ff9800; }
        .btn { width: 100%; padding: 12px; background-color: #ff9800; color: #121212; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn:hover { background-color: #e68900; }
        .links { margin-top: 15px; font-size: 14px; text-align: center; }
        .links a { color: #ff9800; text-decoration: none; }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="signup-container">
        <h2>إنشاء حساب جديد</h2>
        <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
            <div class="input-group">
                <label for="fullname">الاسم الكامل</label>
                <input type="text" id="fullname" required placeholder="ادخل اسمك ثلاثي...">
            </div>
            <div class="input-group">
                <label for="email">البريد الإلكتروني (Gmail)</label>
                <input type="email" id="email" required placeholder="example@gmail.com">
            </div>
            <div class="input-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <div class="input-group">
                <label for="phone">رقم الهاتف الشخصي</label>
                <input type="tel" id="phone" pattern="[0-9]{11}" required placeholder="01012345678 (11 رقم)">
            </div>
            <div class="input-group">
                <label for="national_id">الرقم القومي</label>
                <input type="text" id="national_id" pattern="[0-9]{14}" required placeholder="14 رقم قومي صحيح" maxlength="14">
            </div>
            <div class="input-group">
                <label for="parent_phone">رقم ولي الأمر</label>
                <input type="tel" id="parent_phone" pattern="[0-9]{11}" required placeholder="01012345678 (11 رقم)">
            </div>
            <button type="submit" class="btn">تسجيل وحفظ الحساب</button>
        </form>
        <div class="links">
            <p>لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a></p>
            <p style="margin-top: 8px;"><a href="index.html">العودة للرئيسية</a></p>
        </div>
    </div>
</body>
</html>
