<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كورساتي المشترك فيها - منصة أسامة</title>
    <style>
        :root {
            --bg-color: #0d1117; --card-bg: #161b22; --text-color: #c9d1d9;
            --accent-color: #ffc107; --border-color: #30363d; --hover-bg: #21262d;
        }
        body.light-mode {
            --bg-color: #f6f8fa; --card-bg: #ffffff; --text-color: #24292f;
            --border-color: #d0d7de; --hover-bg: #f3f4f6;
        }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Segoe UI', Tahoma, sans-serif; direction: rtl; margin: 0; padding-top: 90px; }
        
        /* النافبار الأصلية */
        .navbar {
            position: fixed; top: 0; right: 0; left: 0; height: 75px;
            background-color: var(--card-bg); border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center; padding: 0 35px; z-index: 1000;
        }
        .nav-left, .nav-right { display: flex; align-items: center; gap: 20px; }
        .logo { color: #ff5722; font-weight: bold; font-size: 24px; text-decoration: none; display: flex; align-items: center; gap: 8px; }
        
        .nav-link {
            color: var(--text-color); text-decoration: none; font-weight: 600; font-size: 15px;
            padding: 8px 14px; border-radius: 8px; transition: 0.2s; display: flex; align-items: center; gap: 6px;
        }
        .nav-link:hover { background-color: var(--hover-bg); color: var(--accent-color); }
        
        .wallet-badge {
            background: var(--hover-bg); border: 1px solid var(--border-color);
            padding: 8px 15px; border-radius: 20px; font-weight: bold; color: var(--accent-color);
            display: flex; align-items: center; gap: 6px; font-size: 14px;
        }
        .theme-toggle {
            background: var(--hover-bg); border: 1px solid var(--border-color);
            color: var(--text-color); width: 40px; height: 40px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: 0.2s;
        }
        .theme-toggle:hover { border-color: var(--accent-color); transform: scale(1.05); }

        .user-menu-container { position: relative; display: inline-block; }
        .user-avatar-btn {
            width: 42px; height: 42px; border-radius: 50%; background: var(--hover-bg);
            border: 2px solid var(--accent-color); cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 18px; overflow: hidden; padding: 0;
        }
        .user-avatar-btn img { width: 100%; height: 100%; object-fit: cover; }
        
        .dropdown-menu {
            display: none; position: absolute; left: 0; top: 55px;
            background-color: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); width: 180px; overflow: hidden; z-index: 1001;
        }
        .dropdown-menu.show { display: block; }
        .dropdown-item {
            padding: 12px 16px; color: var(--text-color); text-decoration: none;
            display: block; font-size: 14px; font-weight: 600; transition: 0.2s; border-bottom: 1px solid var(--border-color);
        }
        .dropdown-item:last-child { border-bottom: none; }
        .dropdown-item:hover { background-color: var(--hover-bg); color: var(--accent-color); }

        /* محتوى صفحة كورساتي */
        .main-container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .section-title { color: var(--accent-color); margin-bottom: 25px; font-size: 24px; text-align: center; }
        
        .courses-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .course-card {
            background-color: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 16px; padding: 25px; box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; justify-content: space-between; transition: 0.2s;
        }
        .course-card:hover { transform: translateY(-5px); border-color: var(--accent-color); }
        .course-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; color: var(--text-color); }
        .course-desc { font-size: 14px; color: #8b949e; margin-bottom: 20px; line-height: 1.5; }
        
        .enter-btn {
            background-color: #2ecc71; color: #fff; border: none; text-align: center; text-decoration: none;
            padding: 10px; border-radius: 8px; font-weight: bold; font-size: 14px;
            cursor: pointer; transition: 0.2s; display: block;
        }
        .enter-btn:hover { opacity: 0.9; box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3); }

        .empty-msg { text-align: center; color: #8b949e; font-size: 16px; grid-column: 1 / -1; padding: 40px; }
    </style>
</head>
<body>

    <!-- النافبار الأصلية -->
    <nav class="navbar">
        <div class="nav-left">
            <a href="dashboard.html" class="logo"><span>🧬</span> منصة أسامة</a>
            <a href="dashboard.html" class="nav-link"><span>🏠</span> الرئيسية</a>
        </div>
        <div class="nav-right">
            <div class="wallet-badge" id="walletBadge">💰 0 جنيه</div>
            <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()">🌙</button>
            <div class="user-menu-container">
                <button class="user-avatar-btn" id="navUserAvatar" onclick="toggleUserMenu()">👤</button>
                <div class="dropdown-menu" id="userDropdown">
                    <a href="profile.html" class="dropdown-item">👤 الملف الشخصي</a>
                    <a href="wallet.html" class="dropdown-item">💳 شحن المحفظة</a>
                    <a href="login.html" class="dropdown-item" style="color: #ff5722;" onclick="logout()">🚪 تسجيل الخروج</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <h2 class="section-title">🎯 كورساتي المشترك فيها</h2>
        
        <div class="courses-grid" id="myCoursesGrid">
            <!-- سيتم تعبئة الكورسات المشترك فيها ديناميكياً من الـ localStorage -->
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            if (localStorage.getItem('theme') === 'light') {
                document.body.classList.add('light-mode');
                document.getElementById('themeToggleBtn').innerText = '☀️';
            }

            const avatar = localStorage.getItem('userAvatar') || '👤';
            document.getElementById('navUserAvatar').innerText = avatar;

            updateWalletDisplay();
            loadMyCourses();
        });

        function updateWalletDisplay() {
            const balance = localStorage.getItem('walletBalance') || "0";
            document.getElementById('walletBadge').innerText = `💰 ${balance} جنيه`;
        }

        function loadMyCourses() {
            const grid = document.getElementById('myCoursesGrid');
            const myCourses = JSON.parse(localStorage.getItem('myCourses') || "[]");

            if (myCourses.length === 0) {
                grid.innerHTML = `<div class="empty-msg">لم تقم بالاشتراك في أي كورسات حتى الآن. تصفح <a href="available-courses.html" style="color: var(--accent-color);">الكورسات المتاحة</a> وابدأ رحلتك الآن!</div>`;
                return;
            }

            let html = "";
            myCourses.forEach(course => {
                html += `
                    <div class="course-card">
                        <div>
                            <div class="course-title">${course}</div>
                            <div class="course-desc">أنت مشترك بالفعل في هذا الكورس. يمكنك متابعة المحاضرات، المحتوى التعليمي، والامتحانات الخاصة به.</div>
                        </div>
                        <a href="#" class="enter-btn" onclick="alert('جاري فتح محتوى كورس: ${course} 🚀')">دخول الكورس</a>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            document.getElementById('themeToggleBtn').innerText = isLight ? '☀️' : '🌙';
        }

        function toggleUserMenu() {
            document.getElementById('userDropdown').classList.toggle('show');
        }

        window.onclick = function(event) {
            if (!event.target.closest('.user-menu-container')) {
                const dropdowns = document.getElementsByClassName("dropdown-menu");
                for (let i = 0; i < dropdowns.length; i++) {
                    let openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }

        function logout() {
            localStorage.removeItem('loggedIn');
        }
    </script>
</body>
</html>
