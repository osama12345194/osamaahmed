<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شحن المحفظة - منصة أسامة</title>
    <style>
        :root {
            --bg-color: #0d1117; --card-bg: #161b22; --text-color: #c9d1d9;
            --accent-color: #ffc107; --border-color: #30363d; --hover-bg: #21262d;
        }
        body.light-mode {
            --bg-color: #f6f8fa; --card-bg: #ffffff; --text-color: #24292f;
            --border-color: #d0d7de; --hover-bg: #f3f4f6;
        }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Segoe UI', Tahoma, sans-serif; direction: rtl; margin: 0; padding-top: 90px; }
        
        /* النافبار الأصلية */
        .navbar {
            position: fixed; top: 0; right: 0; left: 0; height: 75px;
            background-color: var(--card-bg); border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center; padding: 0 35px; z-index: 1000;
        }
        .nav-left, .nav-right { display: flex; align-items: center; gap: 20px; }
        .logo { color: #ff5722; font-weight: bold; font-size: 24px; text-decoration: none; display: flex; align-items: center; gap: 8px; }
        
        .nav-link {
            color: var(--text-color); text-decoration: none; font-weight: 600; font-size: 15px;
            padding: 8px 14px; border-radius: 8px; transition: 0.2s; display: flex; align-items: center; gap: 6px;
        }
        .nav-link:hover { background-color: var(--hover-bg); color: var(--accent-color); }
        
        .wallet-badge {
            background: var(--hover-bg); border: 1px solid var(--border-color);
            padding: 8px 15px; border-radius: 20px; font-weight: bold; color: var(--accent-color);
            display: flex; align-items: center; gap: 6px; font-size: 14px;
        }
        .theme-toggle {
            background: var(--hover-bg); border: 1px solid var(--border-color);
            color: var(--text-color); width: 40px; height: 40px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: 0.2s;
        }
        .theme-toggle:hover { border-color: var(--accent-color); transform: scale(1.05); }

        .user-menu-container { position: relative; display: inline-block; }
        .user-avatar-btn {
            width: 42px; height: 42px; border-radius: 50%; background: var(--hover-bg);
            border: 2px solid var(--accent-color); cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 18px; overflow: hidden; padding: 0;
        }
        .user-avatar-btn img { width: 100%; height: 100%; object-fit: cover; }
        
        .dropdown-menu {
            display: none; position: absolute; left: 0; top: 55px;
            background-color: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); width: 180px; overflow: hidden; z-index: 1001;
        }
        .dropdown-menu.show { display: block; }
        .dropdown-item {
            padding: 12px 16px; color: var(--text-color); text-decoration: none;
            display: block; font-size: 14px; font-weight: 600; transition: 0.2s; border-bottom: 1px solid var(--border-color);
        }
        .dropdown-item:last-child { border-bottom: none; }
        .dropdown-item:hover { background-color: var(--hover-bg); color: var(--accent-color); }

        /* محتوى صفحة المحفظة */
        .main-container { max-width: 650px; margin: 40px auto; padding: 0 20px; }
        .wallet-card {
            background-color: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 16px; padding: 35px; box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .balance-display {
            background: var(--hover-bg); border: 1px solid var(--border-color);
            border-radius: 14px; padding: 20px; margin-bottom: 25px; text-align: center;
        }
        .balance-display h3 { margin: 0 0 10px 0; color: #8b949e; font-size: 16px; }
        .balance-display .amount { font-size: 32px; font-weight: bold; color: #2ecc71; margin: 0; }
        
        .form-group { margin-bottom: 20px; text-align: right; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: var(--text-color); }
        .form-control {
            width: 100%; padding: 12px 15px; background: var(--hover-bg);
            border: 1px solid var(--border-color); border-radius: 10px; color: var(--text-color);
            font-size: 14px; box-sizing: border-box; outline: none; transition: 0.2s;
        }
        .form-control:focus { border-color: var(--accent-color); box-shadow: 0 0 8px rgba(255, 193, 7, 0.2); }
        
        .methods-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .method-btn {
            background: var(--hover-bg); border: 1px solid var(--border-color); color: var(--text-color);
            padding: 12px; border-radius: 10px; font-weight: 600; cursor: pointer; text-align: center; transition: 0.2s; font-size: 13px;
        }
        .method-btn.active { border-color: var(--accent-color); background-color: rgba(255, 193, 7, 0.1); color: var(--accent-color); }
        
        .instruction-box {
            background: var(--hover-bg); border-right: 4px solid var(--accent-color);
            padding: 12px 15px; border-radius: 8px; font-size: 13px; color: #8b949e; margin-bottom: 20px; line-height: 1.6;
        }

        .charge-btn {
            background-color: var(--accent-color); color: #000; border: none;
            padding: 14px; border-radius: 10px; font-weight: bold; font-size: 16px;
            cursor: pointer; transition: 0.2s; width: 100%; margin-top: 5px;
        }
        .charge-btn:hover { opacity: 0.9; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(255, 193, 7, 0.3); }
    </style>
</head>
<body>

    <!-- النافبار الأصلية -->
    <nav class="navbar">
        <div class="nav-left">
            <a href="dashboard.html" class="logo"><span>🧬</span> منصة أسامة</a>
            <a href="dashboard.html" class="nav-link"><span>🏠</span> الرئيسية</a>
        </div>
        <div class="nav-right">
            <div class="wallet-badge" id="walletBadge">💰 0 جنيه</div>
            <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()">🌙</button>
            <div class="user-menu-container">
                <button class="user-avatar-btn" id="navUserAvatar" onclick="toggleUserMenu()">👤</button>
                <div class="dropdown-menu" id="userDropdown">
                    <a href="profile.html" class="dropdown-item">👤 الملف الشخصي</a>
                    <a href="wallet.html" class="dropdown-item">💳 شحن المحفظة</a>
                    <a href="login.html" class="dropdown-item" style="color: #ff5722;" onclick="logout()">🚪 تسجيل الخروج</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="wallet-card">
            <h2 style="margin-top: 0; color: var(--accent-color); margin-bottom: 20px; text-align: center;">💳 شحن رصيد المحفظة الفعلي</h2>
            
            <div class="balance-display">
                <h3>رصيدك الحالي في المنصة</h3>
                <p class="amount" id="currentBalanceText">0 جنيه</p>
            </div>

            <form onsubmit="chargeWallet(event)">
                <div class="form-group">
                    <label>اختر طريقة الدفع</label>
                    <div class="methods-grid">
                        <button type="button" class="method-btn active" id="btnVodafone" onclick="setMethod('vodafone')">📱 فودافون كاش</button>
                        <button type="button" class="method-btn" id="btnInstapay" onclick="setMethod('instapay')">🏛️ إنستاباي (Instapay)</button>
                        <button type="button" class="method-btn" id="btnCard" onclick="setMethod('card')">💳 بطاقة بنكية / فوري</button>
                    </div>
                </div>

                <div class="instruction-box" id="instructionText">
                    قم بتحويل المبلغ المطلوب على رقم فودافون كاش التالي: <b>01012345678</b>، ثم أدخل تفاصيل التحويل أدناه لتتم مراجعته وتحديث رصيدك بالقيمة الفعالة.
                </div>

                <div class="form-group">
                    <label>المبلغ المراد شحنه وتفعيله (بالجنيه المصري)</label>
                    <input type="number" id="chargeAmount" class="form-control" placeholder="مثال: 200" min="10" required>
                </div>

                <div class="form-group">
                    <label id="referenceLabel">رقم الهاتف المحول منه (فودافون كاش)</label>
                    <input type="text" id="referenceInput" class="form-control" placeholder="أدخل رقمك الذي تم التحويل منه" required>
                </div>

                <button type="submit" class="charge-btn">تأكيد وتفعيل الرصيد الجديد</button>
            </form>
        </div>
    </div>

    <script>
        let selectedMethod = 'vodafone';

        document.addEventListener("DOMContentLoaded", function() {
            if (localStorage.getItem('theme') === 'light') {
                document.body.classList.add('light-mode');
                document.getElementById('themeToggleBtn').innerText = '☀️';
            }

            const avatar = localStorage.getItem('userAvatar') || '👤';
            document.getElementById('navUserAvatar').innerText = avatar;

            updateWalletDisplay();
        });

        function setMethod(method) {
            selectedMethod = method;
            document.getElementById('btnVodafone').classList.remove('active');
            document.getElementById('btnInstapay').classList.remove('active');
            document.getElementById('btnCard').classList.remove('active');

            if (method === 'vodafone') {
                document.getElementById('btnVodafone').classList.add('active');
                document.getElementById('instructionText').innerHTML = 'قم بتحويل المبلغ المطلوب على رقم فودافون كاش التالي: <b>01012345678</b>، ثم أدخل رقمك المحول منه أدناه.';
                document.getElementById('referenceLabel').innerText = 'رقم الهاتف المحول منه (فودافون كاش)';
                document.getElementById('referenceInput').placeholder = '010xxxxxxxx';
            } else if (method === 'instapay') {
                document.getElementById('btnInstapay').classList.add('active');
                document.getElementById('instructionText').innerHTML = 'قم بالتحويل عبر Instapay إلى العنوان اللحظي: <b>osama.platform@instapay</b>، ثم أدخل رقم المعاملة.';
                document.getElementById('referenceLabel').innerText = 'رقم المعاملة (Transaction ID) أو اسم الحساب';
                document.getElementById('referenceInput').placeholder = 'أدخل رقم العملية أو اسمك على إنستاباي';
            } else if (method === 'card') {
                document.getElementById('btnCard').classList.add('active');
                document.getElementById('instructionText').innerHTML = 'أدخل بيانات بطاقتك البنكية بأمان (فيزا / ماستركارد) أو ادفع عبر منافذ فوري المعتمدة.';
                document.getElementById('referenceLabel').innerText = 'آخر 4 أرقام من البطاقة أو كود فوري';
                document.getElementById('referenceInput').placeholder = 'أدخل آخر 4 أرقام أو كود الدفع';
            }
        }

        function updateWalletDisplay() {
            const balance = localStorage.getItem('walletBalance') || "0";
            document.getElementById('walletBadge').innerText = `💰 ${balance} جنيه`;
            document.getElementById('currentBalanceText').innerText = `${balance} جنيه`;
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            document.getElementById('themeToggleBtn').innerText = isLight ? '☀️' : '🌙';
        }

        function toggleUserMenu() {
            document.getElementById('userDropdown').classList.toggle('show');
        }

        window.onclick = function(event) {
            if (!event.target.closest('.user-menu-container')) {
                const dropdowns = document.getElementsByClassName("dropdown-menu");
                for (let i = 0; i < dropdowns.length; i++) {
                    let openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }

        function chargeWallet(e) {
            e.preventDefault();
            const amount = parseInt(document.getElementById('chargeAmount').value);
            const refNumber = document.getElementById('referenceInput').value.trim();

            if (isNaN(amount) || amount <= 0) {
                alert("يرجى إدخال مبلغ مالي صحيح.");
                return;
            }

            if (refNumber.length < 4) {
                alert("يرجى إدخال تفاصيل الدفع أو رقم التحويل بشكل صحيح لتوثيق العملية.");
                return;
            }

            // تحديث الرصيد بالقيمة الفعلية للفلوس التي وصلت وتفعّلت
            localStorage.setItem('walletBalance', amount);

            updateWalletDisplay();
            alert(`تم التحقق من التحويل وتحديث رصيد المحفظة ليصبح بقيمة الفلوس الواصلة (${amount} جنيه) تماماً يا بطل! 🚀`);
            
            document.getElementById('chargeAmount').value = "";
            document.getElementById('referenceInput').value = "";
        }

        function logout() {
            localStorage.removeItem('loggedIn');
        }
    </script>
</body>
</html>
