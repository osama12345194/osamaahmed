<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>إدارة الكورسات - منصة أسامة</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #ffc107;
            --border-color: #30363d;
        }
        
        body.light-mode {
            --bg-color: #f6f8fa;
            --card-bg: #ffffff;
            --text-color: #24292f;
            --border-color: #d0d7de;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            direction: rtl;
            margin: 0;
            padding-top: 90px;
            transition: 0.3s;
        }

        .navbar {
            position: fixed;
            top: 0; right: 0; left: 0;
            height: 70px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            z-index: 1000;
        }
        .nav-right, .nav-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .logo-text {
            color: #ff5722;
            font-weight: bold;
            font-size: 22px;
            text-decoration: none;
        }
        .wallet-badge {
            background-color: #21262d;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .wallet-badge:hover {
            border-color: #ffc107;
        }
        .icon-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 18px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }
        
        .tabs-header {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }
        .tab-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 12px 25px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .tab-btn.active {
            background-color: #ffc107;
            color: #0d1117;
            border-color: #ffc107;
        }

        .section-title {
            color: var(--text-color);
            border-right: 4px solid #ffc107;
            padding-right: 10px;
            margin-bottom: 25px;
            text-align: right;
            font-size: 20px;
        }
        .courses-grid {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }
        .course-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 320px;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(0,0,0,0.3);
            transition: 0.3s;
            text-align: right;
            position: relative;
        }
        .course-card:hover {
            transform: translateY(-8px);
            border-color: #ffc107;
        }
        .course-img {
            height: 160px;
            background: linear-gradient(45deg, #2d3748, #1a202c);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffc107;
            font-size: 40px;
            position: relative;
        }
        .price-tag {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: #ffc107;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            border: 1px solid #ffc107;
        }
        .course-body {
            padding: 20px;
        }
        .course-body h3 {
            margin: 0 0 10px 0;
            font-size: 17px;
        }
        .course-body p {
            color: #8b949e;
            font-size: 14px;
            line-height: 1.6;
            height: 50px;
            margin: 0 0 15px 0;
        }
        .btn-open-course {
            background-color: #ffc107;
            color: #0d1117;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            display: block;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
        }
        .btn-open-course.unlocked {
            background-color: #2ea043;
            color: #ffffff;
        }
        .empty-notice {
            color: #8b949e;
            font-size: 14px;
            background-color: var(--card-bg);
            border: 1px dashed var(--border-color);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            width: 100%;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #ffc107;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-right">
            <a href="dashboard.html" class="logo-text">منصة أسامة 🧬</a>
        </div>
        <div class="nav-left">
            <div class="wallet-badge">
                💳 <span id="walletBalance">0</span> جنيه
            </div>
            <!-- زرار الدعم الفني الصغير في صفحة الكورسات أيضاً -->
            <button class="icon-btn" onclick="alert('💬 تواصل مع الدعم الفني للمنصة عبر الواتساب في أي وقت.')" title="الدعم الفني">📞</button>
            <a href="dashboard.html" class="icon-btn" title="الرئيسية">🏠</a>
        </div>
    </div>

    <div class="main-container">
        <a href="dashboard.html" class="back-link">⬅ العودة لوحة التحكم الرئيسية</a>

        <div class="tabs-header">
            <button class="tab-btn active" id="tabMyBtn" onclick="switchTab('my')">📚 كورساتي المشترك بها</button>
            <button class="tab-btn" id="tabAvailableBtn" onclick="switchTab('available')">🌟 الكورسات المتاحة</button>
        </div>

        <div id="sectionMyCourses">
            <h2 class="section-title">الكورسات التي قمت بالاشتراك فيها وتستطيع دراستها الآن</h2>
            <div id="myCoursesContainer" class="courses-grid"></div>
        </div>

        <div id="sectionAvailableCourses" style="display: none;">
            <h2 class="section-title">الكورسات المتاحة للاشتراك برصيد محفظتك</h2>
            <div id="availableCoursesContainer" class="courses-grid"></div>
        </div>
    </div>

    <script>
        const allCourses = [
            {
                id: 1,
                title: "كورس شرح الفصل الأول: الدعامة والحركة",
                desc: "شرح تفصيلي لآليات الدعامة في النبات والإنسان مع تشريح كامل.",
                price: 100,
                icon: "🩺",
                url: "course-details.html"
            },
            {
                id: 2,
                title: "كورس شرح الفصل الثاني: التنسيق الهرموني",
                desc: "شرح الغدد الصماء وآليات عمل الهرمونات في جسم الكائنات الحية.",
                price: 150,
                icon: "🧪",
                url: "course-details.html"
            }
        ];

        document.addEventListener("DOMContentLoaded", function() {
            updateWalletDisplay();
            renderCourses();

            const urlParams = new URLSearchParams(window.location.search);
            const tab = urlParams.get('tab');
            if (tab === 'available') {
                switchTab('available');
            } else {
                switchTab('my');
            }
        });

        function getBalance() {
            return parseInt(localStorage.getItem('wallet_balance')) || 0;
        }

        function updateWalletDisplay() {
            document.getElementById('walletBalance').innerText = getBalance();
        }

        function switchTab(tabName) {
            const mySection = document.getElementById('sectionMyCourses');
            const availableSection = document.getElementById('sectionAvailableCourses');
            const myBtn = document.getElementById('tabMyBtn');
            const availableBtn = document.getElementById('tabAvailableBtn');

            if (tabName === 'my') {
                mySection.style.display = 'block';
                availableSection.style.display = 'none';
                myBtn.classList.add('active');
                availableBtn.classList.remove('active');
            } else {
                mySection.style.display = 'none';
                availableSection.style.display = 'block';
                availableBtn.classList.add('active');
                myBtn.classList.remove('active');
            }
        }

        function renderCourses() {
            let myCoursesHTML = "";
            let availableCoursesHTML = "";

            allCourses.forEach(course => {
                let isBought = localStorage.getItem(`course_${course.id}_bought`) === 'true';

                if (isBought) {
                    myCoursesHTML += `
                        <div class="course-card">
                            <div class="course-img">${course.icon}</div>
                            <div class="course-body">
                                <h3>${course.title}</h3>
                                <p>${course.desc}</p>
                                <a href="${course.url}" class="btn-open-course unlocked">✅ دخول الكورس</a>
                            </div>
                        </div>
                    `;
                } else {
                    availableCoursesHTML += `
                        <div class="course-card">
                            <div class="course-img">
                                ${course.icon}
                                <div class="price-tag">${course.price} جنيه</div>
                            </div>
                            <div class="course-body">
                                <h3>${course.title}</h3>
                                <p>${course.desc}</p>
                                <button class="btn-open-course" onclick="buyCourse(${course.id}, ${course.price})">شراء واشترك الآن</button>
                            </div>
                        </div>
                    `;
                }
            });

            if (myCoursesHTML === "") {
                myCoursesHTML = `<div class="empty-notice">لم تقم بالاشتراك في اي كورس بعد. انتقل إلى تبويب (الكورسات المتاحة) واشترك فوراً! 🚀</div>`;
            }

            document.getElementById('myCoursesContainer').innerHTML = myCoursesHTML;
            document.getElementById('availableCoursesContainer').innerHTML = availableCoursesHTML;
        }

        function buyCourse(courseId, price) {
            let balance = getBalance();
            if (balance >= price) {
                if (confirm(`هل تريد خصم ${price} جنيه من محفظتك للاشتراك في هذا الكورس؟`)) {
                    balance -= price;
                    localStorage.setItem('wallet_balance', balance);
                    localStorage.setItem(`course_${courseId}_bought`, 'true');
                    updateWalletDisplay();
                    renderCourses();
                    switchTab('my');
                    alert("🎉 مبروك! تم خصم المبلغ بنجاح وانتقل الكورس إلى قسم (كورساتي المشترك بها).");
                }
            } else {
                alert(`❌ رصيد محفظتك غير كافي (${balance} جنيه). يرجى شحن المحفظة أولاً.`);
            }
        }
    </script>
</body>
</html>
