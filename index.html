<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الأحياء - الرئيسية</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; text-align: center; }
        .container { background-color: #1e1e1e; padding: 40px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); width: 100%; max-width: 400px; }
        h1 { color: #ff9800; margin-bottom: 20px; font-size: 26px; }
        p { color: #cccccc; margin-bottom: 30px; font-size: 15px; }
        .btn { display: block; width: 100%; padding: 12px; margin-bottom: 12px; background-color: #ff9800; color: #121212; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; text-decoration: none; cursor: pointer; transition: background-color 0.3s; }
        .btn:hover { background-color: #e68900; }
        .btn-outline { background-color: transparent; border: 2px solid #ff9800; color: #ff9800; }
        .btn-outline:hover { background-color: #ff9800; color: #121212; }
    </style>
</head>
<body>
    <div class="container">
        <h1>أهلاً بك في منصة الأحياء</h1>
        <p>الرجاء تسجيل الدخول أو إنشاء حساب جديد للمتابعة</p>
        <a href="login.html" class="btn">تسجيل الدخول</a>
        <a href="signup.html" class="btn btn-outline">إنشاء حساب جديد</a>
    </div>
</body>
</html>
